{% extends 'sitecontent/base.html' %}{% load site_tags %}{% block content %}<section class="section"><div class="wrap"><a class="back-link" href="/gallery">← Gallery</a><p class="eyebrow">The Archive</p><h1>{{ collection.title }}</h1><div class="photo-grid">{% for photo in collection.photos %}<figure><button class="photo-open" data-full="{{ photo.filename|asset_url }}" data-alt="{{ photo.alt }}"><img src="{{ photo.filename|asset_url }}" alt="{{ photo.alt }}" loading="lazy"></button><figcaption>{{ photo.alt }}</figcaption></figure>{% endfor %}</div></div></section>{% endblock %}
