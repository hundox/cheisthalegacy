{% load site_tags %}<figure class="mosaic-photo {% if primary %}primary-photo{% endif %}">{% if photo.kind == 'video' %}<video src="{{ photo.filename|asset_url }}" aria-label="{{ photo.alt }}" autoplay muted loop playsinline preload="metadata"></video>{% else %}<button class="photo-open" data-full="{{ photo.filename|asset_url }}" data-alt="{{ photo.alt }}"><img src="{{ photo.filename|asset_url }}" alt="{{ photo.alt }}" loading="lazy"></button>{% endif %}<figcaption>{{ photo.alt }}</figcaption></figure>
